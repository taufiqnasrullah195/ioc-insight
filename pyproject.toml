[project]
name = "ioc-insight"
version = "0.1.0"
description = "AI-powered IOC triage tool for SOC L1 analysts — multi-source threat intel enrichment with verdict synthesis (EN/DE/ID)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.85",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-whois>=0.9",
    "openai>=1.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
iocinsight = "ioc_insight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ioc_insight"]
